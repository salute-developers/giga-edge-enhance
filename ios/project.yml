name: GigaDenoiserSDK
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 1
    # Kept in step with the repository-root VERSION_NUMBER by Release Please. The trailing
    # annotation is what tells its generic updater which value to rewrite.
    MARKETING_VERSION: 0.0.1 # x-release-please-version
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright (c) 2026 Giga Edge. MIT License."
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
targets:
  GigaDenoiserAudioKit:
    type: framework
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gigaedge.DenoiserAudioKit
        DEFINES_MODULE: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        GENERATE_INFOPLIST_FILE: YES
        MODULEMAP_PRIVATE_FILE: "$(SRCROOT)/Sources/GigaDenoiserAudioKit/include/GigaDenoiserAudioKit.private.modulemap"
        OTHER_LDFLAGS: "$(inherited) -lgiga-denoiser"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../core/include"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: "$(SRCROOT)/../out/artifacts/ios/device"
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: "$(SRCROOT)/../out/artifacts/ios/simulator"
    preBuildScripts:
      - name: Build GigaDenoiser core
        script: |
          set -euo pipefail
          "$SRCROOT/scripts/build_core.sh"
    sources:
      - path: Sources/GigaDenoiserAudioKit/Swift
      - path: Sources/GigaDenoiserAudioKit/ObjC
      - path: Sources/GigaDenoiserAudioKit/Documentation.docc
      - path: Sources/GigaDenoiserAudioKit/include/GigaDenoiserAudioKit.h
        buildPhase: headers
        headerVisibility: public
      - path: Sources/GigaDenoiserAudioKit/include/PipelineElements.h
        buildPhase: headers
        headerVisibility: private
      - path: Sources/GigaDenoiserAudioKit/include/RingBuffer.h
        buildPhase: headers
        headerVisibility: private
      - path: Sources/GigaDenoiserAudioKit/include/AtomicOptionalDouble.h
        buildPhase: headers
        headerVisibility: private
      - path: Sources/GigaDenoiserAudioKit/include/WorkerThreadEvent.h
        buildPhase: headers
        headerVisibility: private
      - path: Sources/GigaDenoiserAudioKit/include/LowPerformanceEventMailbox.h
        buildPhase: headers
        headerVisibility: private

  GigaDenoiserModelFast8:
    type: bundle
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gigaedge.DenoiserModelFast8
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/ModelBundles/GigaDenoiserModelFast8-Info.plist
    sources:
      - path: Resources/Models/fast8.gdn

  GigaDenoiserModelQuality48:
    type: bundle
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gigaedge.DenoiserModelQuality48
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/ModelBundles/GigaDenoiserModelQuality48-Info.plist
    sources:
      - path: Resources/Models/quality48.gdn

  AudioDemoApp:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gigaedge.AudioDemoApp
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/AudioDemoApp/Info.plist
    dependencies:
      - target: GigaDenoiserAudioKit
      - target: GigaDenoiserModelFast8
      - target: GigaDenoiserModelQuality48
    sources:
      - path: Sources/AudioDemoApp

  GigaDenoiserAudioKitTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gigaedge.DenoiserAudioKitTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: GigaDenoiserAudioKit
      - target: GigaDenoiserModelFast8
      - target: GigaDenoiserModelQuality48
    sources:
      - path: Tests/GigaDenoiserAudioKitTests

  AudioDemoAppUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gigaedge.AudioDemoAppUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AudioDemoApp
    dependencies:
      - target: AudioDemoApp
    sources:
      - path: Tests/AudioDemoAppUITests
    scheme:
      testTargets:
        - AudioDemoAppUITests

schemes:
  GigaDenoiserAudioKit:
    build:
      targets:
        GigaDenoiserAudioKit: all
        GigaDenoiserModelFast8: all
        GigaDenoiserModelQuality48: all
        GigaDenoiserAudioKitTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - GigaDenoiserAudioKitTests

  AudioDemoApp:
    build:
      targets:
        AudioDemoApp: all
    run:
      config: Debug
    test:
      gatherCoverageData: true
      targets:
        - AudioDemoAppUITests
