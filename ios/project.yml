name: GigaEdgeEnhanceSDK
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 1
    # Kept in step with the repository-root VERSION_NUMBER by Release Please. The trailing
    # annotation is what tells its generic updater which value to rewrite.
    MARKETING_VERSION: 1.0.0 # x-release-please-version
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright (c) 2026 Giga Edge. MIT License."
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
targets:
  EnhanceAudioKit:
    type: framework
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gigaedge.EnhanceAudioKit
        DEFINES_MODULE: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        GENERATE_INFOPLIST_FILE: YES
        MODULEMAP_PRIVATE_FILE: "$(SRCROOT)/Sources/EnhanceAudioKit/include/EnhanceAudioKit.private.modulemap"
        OTHER_LDFLAGS: "$(inherited) -lgiga-edge-enhance"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../core/include"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: "$(SRCROOT)/../out/artifacts/ios/device"
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: "$(SRCROOT)/../out/artifacts/ios/simulator"
    preBuildScripts:
      - name: Build GigaEdgeEnhance core
        script: |
          set -euo pipefail
          "$SRCROOT/scripts/build_core.sh"
    sources:
      - path: Sources/EnhanceAudioKit/Swift
      - path: Sources/EnhanceAudioKit/ObjC
      - path: Sources/EnhanceAudioKit/Documentation.docc
      - path: Sources/EnhanceAudioKit/include/EnhanceAudioKit.h
        buildPhase: headers
        headerVisibility: public
      - path: Sources/EnhanceAudioKit/include/PipelineElements.h
        buildPhase: headers
        headerVisibility: private
      - path: Sources/EnhanceAudioKit/include/RingBuffer.h
        buildPhase: headers
        headerVisibility: private
      - path: Sources/EnhanceAudioKit/include/AtomicOptionalDouble.h
        buildPhase: headers
        headerVisibility: private
      - path: Sources/EnhanceAudioKit/include/WorkerThreadEvent.h
        buildPhase: headers
        headerVisibility: private
      - path: Sources/EnhanceAudioKit/include/LowPerformanceEventMailbox.h
        buildPhase: headers
        headerVisibility: private

  EnhanceModelFast8:
    type: bundle
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gigaedge.EnhanceModelFast8
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/ModelBundles/EnhanceModelFast8-Info.plist
    sources:
      - path: Resources/Models/fast8.enhance

  EnhanceModelQuality48:
    type: bundle
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gigaedge.EnhanceModelQuality48
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/ModelBundles/EnhanceModelQuality48-Info.plist
    sources:
      - path: Resources/Models/quality48.enhance

  EnhanceModelHybrid48:
    type: bundle
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gigaedge.EnhanceModelHybrid48
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/ModelBundles/EnhanceModelHybrid48-Info.plist
    sources:
      - path: Resources/Models/hybrid48.enhance

  AudioDemoApp:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gigaedge.AudioDemoApp
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/AudioDemoApp/Info.plist
    dependencies:
      - target: EnhanceAudioKit
      - target: EnhanceModelFast8
      - target: EnhanceModelQuality48
      - target: EnhanceModelHybrid48
    sources:
      - path: Sources/AudioDemoApp

  EnhanceAudioKitTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gigaedge.EnhanceAudioKitTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: EnhanceAudioKit
      - target: EnhanceModelFast8
      - target: EnhanceModelQuality48
      - target: EnhanceModelHybrid48
    sources:
      - path: Tests/EnhanceAudioKitTests

  AudioDemoAppUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gigaedge.AudioDemoAppUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AudioDemoApp
    dependencies:
      - target: AudioDemoApp
    sources:
      - path: Tests/AudioDemoAppUITests
    scheme:
      testTargets:
        - AudioDemoAppUITests

schemes:
  EnhanceAudioKit:
    build:
      targets:
        EnhanceAudioKit: all
        EnhanceModelFast8: all
        EnhanceModelQuality48: all
        EnhanceModelHybrid48: all
        EnhanceAudioKitTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - EnhanceAudioKitTests

  AudioDemoApp:
    build:
      targets:
        AudioDemoApp: all
    run:
      config: Debug
    test:
      gatherCoverageData: true
      targets:
        - AudioDemoAppUITests
