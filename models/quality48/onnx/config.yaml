model:
  # model path
  model_path: model.onnx

feature_params:
  # sampling rate
  sampling_freq: 48000
  # window length
  frame_size_ms: 32
  # window hop length
  frame_stride_ms: 16
  # hamming or hanning
  window_type: hanning

inference:
  gpu: false
  engine_num_threads: 1
  # 48 kHz quality discriminative model
  model_type: denoiser_discr_web_model
