name: Bug report
description: Report a reproducible problem in GigaEdgeEnhance
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not report security vulnerabilities here; use **Report a vulnerability** on the repository's Security tab.

  - type: dropdown
    id: platform
    attributes:
      label: Affected area
      options:
        - Core C or C++ SDK
        - Web SDK or WebAssembly
        - Android SDK
        - iOS SDK
        - Build, packaging, or CI
        - Documentation or demo
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or revision
      description: Release version, tag, or commit SHA where the problem occurs.
      placeholder: 0.0.1 or abc1234
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, compiler or SDK, inference engine, browser or device, and relevant model.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reproducible example and exact commands or API calls.
      placeholder: |
        1. Build with ...
        2. Configure ...
        3. Run ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and diagnostics
      description: Remove credentials, private URLs, proprietary audio, and other sensitive data.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and documentation for this problem.
          required: true
        - label: This report does not disclose a security vulnerability or sensitive data.
          required: true
