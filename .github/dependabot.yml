version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Etc/UTC
    groups:
      non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: build(deps)

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Etc/UTC
    groups:
      non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: build(deps)

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Etc/UTC
    groups:
      non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: build(deps)

  - package-ecosystem: docker
    directory: /dockerfiles
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Etc/UTC
    groups:
      non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: build(deps)

  - package-ecosystem: pip
    directory: /web/apps/site
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Etc/UTC
    groups:
      non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: build(deps)
