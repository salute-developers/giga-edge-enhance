name: Prepare release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && vars.ENABLE_ARTIFACT_UPLOADS != 'false'
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX_X64 || '"ubuntu-24.04"') }}
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-assets:
    name: Publish tested release assets
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release-assets.yml
    with:
      ci-run-id: ${{ github.event.workflow_run.id }}
      tag: ${{ needs.release-please.outputs.tag-name }}
