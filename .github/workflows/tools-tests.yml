name: Test infrastructure tool

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Test tools
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX_X64 || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            infra:
              - 'tools/build'
              - 'tools/test'
              - 'tools/package'
              - 'tools/install'
              - 'tools/shell'
              - 'tools/ci'
              - 'tools/infra/**'
              - 'python/scripts/**'
              - 'ios/scripts/prepare_simulator.py'
              - 'ios/scripts/test.sh'
            release:
              - '.github/scripts/promote-release-assets.js'
              - '.github/scripts/promote-release-assets.test.js'
              - '.github/workflows/release-assets.yml'
              - '.github/workflows/python-wheels.yml'
      - name: Run infrastructure unit tests
        if: steps.changes.outputs.infra == 'true'
        env:
          PYTHONPATH: tools
        run: python3 -m unittest discover -s tools/infra/tests -v
      - name: Validate infrastructure Python syntax
        if: steps.changes.outputs.infra == 'true'
        run: python3 -m compileall -q tools/infra tools ios/scripts
      - name: Test release asset promotion
        if: steps.changes.outputs.release == 'true'
        run: node --test .github/scripts/promote-release-assets.test.js
