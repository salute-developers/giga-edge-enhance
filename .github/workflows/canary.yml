name: Publish PR canary artifacts

on:
  pull_request:
    branches: [dev, master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: read

jobs:
  version:
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        run: echo "value=$(tr -d '\\n' < VERSION)-canary.pr.${{ github.event.pull_request.number }}.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  native:
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [native-release-onnx, native-release-tflite]
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: ./.github/actions/setup-spench-cache
        with:
          preset: ${{ matrix.preset }}
      - run: tools/spench package ${{ matrix.preset }}
        env:
          SPENCH_ARTIFACT_VERSION: ${{ needs.version.outputs.value }}
      - uses: actions/upload-artifact@v4
        with:
          name: spench-${{ matrix.preset }}-${{ needs.version.outputs.value }}
          path: out/artifacts/${{ matrix.preset }}
          retention-days: 14

  android:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: ./.github/actions/setup-spench-cache
        with:
          preset: android
      - run: tools/spench build android
        env:
          SPENCH_ARTIFACT_VERSION: ${{ needs.version.outputs.value }}
      - uses: actions/upload-artifact@v4
        with:
          name: spench-android-${{ needs.version.outputs.value }}
          path: platform_wrappers/android/**/build/outputs/**
          retention-days: 14

  ios:
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - run: tools/spench build ios --host
      - run: tar -C platform_wrappers/ios/build/xcframework -czf spench-ios-${{ needs.version.outputs.value }}.tar.gz SpenchAudioKit.xcframework SpenchModelLite8k.bundle SpenchModelQuality48k.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: spench-ios-${{ needs.version.outputs.value }}
          path: spench-ios-${{ needs.version.outputs.value }}.tar.gz
          retention-days: 14

  macos:
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - run: tools/spench install macos-arm64-release-onnx --host
      - run: tar -C out/artifacts/install -czf spench-macos-${{ needs.version.outputs.value }}.tar.gz macos-arm64-release-onnx
      - uses: actions/upload-artifact@v4
        with:
          name: spench-macos-${{ needs.version.outputs.value }}
          path: spench-macos-${{ needs.version.outputs.value }}.tar.gz
          retention-days: 14

  windows:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - run: python tools/spench install windows-x64-release-tflite --host
      - shell: bash
        run: tar -C out/artifacts/install -czf spench-windows-${{ needs.version.outputs.value }}.tar.gz windows-x64-release-tflite
      - uses: actions/upload-artifact@v4
        with:
          name: spench-windows-${{ needs.version.outputs.value }}
          path: spench-windows-${{ needs.version.outputs.value }}.tar.gz
          retention-days: 14

  web:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - run: npm version ${{ needs.version.outputs.value }} --no-git-tag-version --workspace=@gigaedge/spench-web-sdk
        working-directory: platform_wrappers/web
      - run: tools/spench build web
      - run: npm pack --workspace=@gigaedge/spench-web-sdk --pack-destination ../../out/artifacts
        working-directory: platform_wrappers/web
      - uses: actions/upload-artifact@v4
        with:
          name: spench-web-${{ needs.version.outputs.value }}
          path: out/artifacts/*.tgz
          retention-days: 14
