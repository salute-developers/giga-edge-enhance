name: Publish release assets

on:
  workflow_call:
    inputs:
      ci-run-id:
        description: Successful CI run containing the release artifacts
        required: true
        type: string
      tag:
        description: Existing GitHub release tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ci-run-id:
        description: Successful CI run containing the release artifacts
        required: true
        type: string
      tag:
        description: Existing GitHub release tag
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Promote tested CI artifacts
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX_X64 || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - name: Download tested artifact archives
        shell: bash
        env:
          CI_RUN_ID: ${{ inputs.ci-run-id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}")"
          conclusion="$(jq -r '.conclusion' <<< "$run_json")"
          event="$(jq -r '.event' <<< "$run_json")"
          branch="$(jq -r '.head_branch' <<< "$run_json")"
          ci_sha="$(jq -r '.head_sha' <<< "$run_json")"
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')"

          if [[ "$conclusion" != "success" || "$event" != "push" || "$branch" != "master" ]]; then
            echo "CI run ${CI_RUN_ID} is not a successful master push run." >&2
            exit 1
          fi
          if [[ "$ci_sha" != "$tag_sha" ]]; then
            echo "CI run ${CI_RUN_ID} tested ${ci_sha}, but ${RELEASE_TAG} points to ${tag_sha}." >&2
            exit 1
          fi

          mkdir -p release-assets
          artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/artifacts?per_page=100")"
          while IFS='|' read -r source destination; do
            artifact_id="$(jq -r --arg name "${source}-${ci_sha}" \
              '.artifacts[] | select(.name == $name and .expired == false) | .id' <<< "$artifacts_json")"
            if [[ -z "$artifact_id" ]]; then
              echo "Required CI artifact ${source}-${ci_sha} was not found." >&2
              exit 1
            fi
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              > "release-assets/${destination}-${RELEASE_TAG}.zip"
          done <<'ARTIFACTS'
          spench-package-native-release-onnx|spench-linux-onnx
          spench-package-native-release-tflite|spench-linux-tflite
          spench-install-macos-arm64-release-onnx|spench-macos-arm64-onnx
          spench-install-macos-arm64-release-tflite|spench-macos-arm64-tflite
          spench-install-macos-x86_64-release-onnx|spench-macos-x86_64-onnx
          spench-install-macos-x86_64-release-tflite|spench-macos-x86_64-tflite
          spench-install-windows-x64-release-onnx|spench-windows-x64-onnx
          spench-install-windows-x64-release-tflite|spench-windows-x64-tflite
          spench-android|spench-android
          spench-ios|spench-ios
          spench-web-sdk|spench-web-sdk
          ARTIFACTS

          (
            cd release-assets
            sha256sum -- *.zip > SHA256SUMS
          )

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          release_id="$(jq -r '.id' <<< "$release_json")"
          for asset in release-assets/*; do
            name="$(basename "$asset")"
            existing_id="$(jq -r --arg name "$name" \
              '.assets[] | select(.name == $name) | .id' <<< "$release_json")"
            if [[ -n "$existing_id" ]]; then
              gh api -H "Accept: application/octet-stream" \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${existing_id}" > existing-asset
              if ! cmp --silent "$asset" existing-asset; then
                echo "Release asset ${name} already exists with different contents." >&2
                exit 1
              fi
              continue
            fi
            gh release upload "$RELEASE_TAG" "$asset"
          done
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -F draft=false
