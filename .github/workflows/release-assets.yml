name: Publish release assets

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: read

jobs:
  native:
    name: Linux ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [native-release-onnx, native-release-tflite]
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: ./.github/actions/setup-spench-cache
        with:
          preset: ${{ matrix.preset }}
      - name: Build ${{ matrix.preset }}
        run: tools/spench build ${{ matrix.preset }}
      - name: Test ${{ matrix.preset }}
        run: tools/spench test ${{ matrix.preset }}
      - name: Package ${{ matrix.preset }}
        run: tools/spench package ${{ matrix.preset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}
          path: out/artifacts/${{ matrix.preset }}

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: ./.github/actions/setup-spench-cache
        with:
          preset: android
      - name: Build Android Release
        run: tools/spench build android
      - name: Test Android Release
        run: tools/spench test android
      - run: tar -C platform_wrappers/android -czf out/artifacts/spench-android-${{ github.ref_name }}.tar.gz --exclude='build' spench-sdk/build/outputs spench-model-full24k/build/outputs spench-model-full48k/build/outputs
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/artifacts/spench-android-${{ github.ref_name }}.tar.gz

