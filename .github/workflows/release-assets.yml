  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: ./.github/actions/setup-spench-cache
        with:
          preset: wasm-release
      - name: Build Web
        run: tools/spench build web
      - name: Test Web
        run: tools/spench test web
      - name: Package Web SDK
        run: tools/spench package web
      - name: Test Web Playwright
        run: tools/spench test web-playwright
      - uses: actions/upload-artifact@v4
        with:
          name: web-sdk
          path: out/artifacts/web/*.tgz

  release:
    needs: [native, android, web] # , ios, macos, windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" release-assets/* --clobber
