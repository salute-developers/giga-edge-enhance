name: Publish release assets

on:
  workflow_call:
    inputs:
      ci-run-id:
        description: Successful CI run containing the release artifacts
        required: true
        type: string
      tag:
        description: Existing GitHub release tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ci-run-id:
        description: Successful CI run containing the release artifacts
        required: true
        type: string
      tag:
        description: Existing GitHub release tag
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Promote tested CI artifacts
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX_X64 || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Promote tested artifacts and publish release
        uses: actions/github-script@v8
        env:
          CI_RUN_ID: ${{ inputs.ci-run-id }}
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { promoteReleaseAssets } = require('./.github/scripts/promote-release-assets.js');
            await promoteReleaseAssets({
              github,
              context,
              core,
              ciRunId: process.env.CI_RUN_ID,
              releaseTag: process.env.RELEASE_TAG,
            });
