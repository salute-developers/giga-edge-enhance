name: Publish documentation and web demo

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  actions: read
  contents: write

concurrency:
  group: pages-master
  cancel-in-progress: true

jobs:
  publish:
    name: Publish documentation and web demo
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: spench-web-${{ github.event.workflow_run.head_sha }}
          path: web-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: web-artifact/apps/spench-site/build
          keep_files: true
