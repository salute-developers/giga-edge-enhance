name: Publish documentation and web demo

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish documentation and web demo
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success' &&
      vars.ENABLE_ARTIFACT_UPLOADS != 'false'
    concurrency:
      group: pages-master
      cancel-in-progress: true
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX_X64 || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gdn-web-site-${{ github.event.workflow_run.head_sha }}
          path: web-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: web-artifact
          keep_files: true
