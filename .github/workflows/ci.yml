  deps-ios:
    name: Build iOS ${{ matrix.slice }} Release dependency OCI
    needs: tools-tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.RUNNER_MACOS_ARM64 || '"macos-15"') }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        slice: [device, simulator]
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: ./.github/actions/verify-lfs
      - id: toolchain
        uses: ./.github/actions/setup-host-toolchain
      - uses: ./.github/actions/setup-spench-cache
        with:
          preset: ios-${{ matrix.slice }}-release
      - uses: ./.github/actions/build-spench-dependency
        with:
          target: ios-${{ matrix.slice }}-release
          toolchain-identity: ${{ steps.toolchain.outputs.identity }}
          token: ${{ secrets.GITHUB_TOKEN }}
          github-source-token: ${{ secrets.GH_PUBLIC_READ_TOKEN }}

  ios:
    name: Build and test iOS Release
    needs: deps-ios
    runs-on: ${{ fromJSON(vars.RUNNER_MACOS_ARM64 || '"macos-15"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: ./.github/actions/verify-lfs
      - id: toolchain
        uses: ./.github/actions/setup-host-toolchain
      - uses: ./.github/actions/setup-spench-cache
        with:
          preset: ios-simulator-release
      - uses: ./.github/actions/setup-spench-dependency
        with:
          target: ios-device-release
          toolchain-identity: ${{ steps.toolchain.outputs.identity }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-spench-dependency
        with:
          target: ios-simulator-release
          toolchain-identity: ${{ steps.toolchain.outputs.identity }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build iOS Release
        env:
          SPENCH_TOOLCHAIN_IDENTITY: ${{ steps.toolchain.outputs.identity }}
        run: tools/spench build ios
      - name: Test iOS Release
        env:
          SPENCH_TOOLCHAIN_IDENTITY: ${{ steps.toolchain.outputs.identity }}
        run: tools/spench test ios
      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: spench-ios-${{ github.sha }}
          path: |
            platform_wrappers/ios/build/xcframework/SpenchAudioKit.xcframework
            platform_wrappers/ios/build/xcframework/SpenchModelFast8.bundle
            platform_wrappers/ios/build/xcframework/SpenchModelQuality48.bundle
          if-no-files-found: error
          retention-days: 1
