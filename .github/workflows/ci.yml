  deps-ios:
    name: Build iOS ${{ matrix.slice }} Release dependency OCI
    runs-on: macos-15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        slice: [device, simulator]
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - id: toolchain
        uses: ./.github/actions/setup-host-toolchain
      - uses: ./.github/actions/setup-spench-cache
        with:
          preset: ios-${{ matrix.slice }}-release
      - uses: ./.github/actions/build-spench-dependency
        with:
          target: ios-${{ matrix.slice }}-release
          toolchain-identity: ${{ steps.toolchain.outputs.identity }}
          token: ${{ secrets.GITHUB_TOKEN }}
          host: 'true'

  ios:
    name: Build and test iOS Release
    needs: deps-ios
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - id: toolchain
        uses: ./.github/actions/setup-host-toolchain
      - uses: ./.github/actions/setup-spench-cache
        with:
          preset: ios-simulator-release
      - uses: ./.github/actions/setup-spench-dependency
        with:
          target: ios-device-release
          toolchain-identity: ${{ steps.toolchain.outputs.identity }}
          token: ${{ secrets.GITHUB_TOKEN }}
          host: 'true'
      - uses: ./.github/actions/setup-spench-dependency
        with:
          target: ios-simulator-release
          toolchain-identity: ${{ steps.toolchain.outputs.identity }}
          token: ${{ secrets.GITHUB_TOKEN }}
          host: 'true'
      - name: Build iOS Release
        env:
          SPENCH_TOOLCHAIN_IDENTITY: ${{ steps.toolchain.outputs.identity }}
        run: tools/spench build ios --host
      - name: Test iOS Release
        env:
          SPENCH_TOOLCHAIN_IDENTITY: ${{ steps.toolchain.outputs.identity }}
        run: tools/spench test ios --host
      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spench-ios-${{ github.sha }}
          path: platform_wrappers/ios/build/xcframework
          retention-days: 14
