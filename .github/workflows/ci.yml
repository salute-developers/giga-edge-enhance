name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tools-tests:
    name: Test infrastructure tool
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/tools-tests.yml

  toolchain-native:
    name: Build native toolchain image
    needs: tools-tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX_X64 || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      identity: ${{ steps.metadata.outputs.identity }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        name: Resolve native toolchain image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}/toolchain:native-$(tools/spench image-key native)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "identity=$(tools/spench recipe-key native)" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Reusing $image"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - id: build
        name: Build native toolchain
        if: steps.metadata.outputs.exists != 'true'
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          targets: native
          # Skip buildx attestations so a single-platform image manifest is
          # published; the pinned recipe key is our reproducible identity.
          provenance: false
          set: |
            native.tags=${{ steps.metadata.outputs.image }}
            native.output=type=registry
            native.cache-from=type=gha,scope=toolchain-native
            native.cache-to=type=gha,mode=max,scope=toolchain-native

  toolchain-web:
    name: Build Web toolchain image
    needs: tools-tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX_X64 || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      identity: ${{ steps.metadata.outputs.identity }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        name: Resolve Web toolchain image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}/toolchain:web-$(tools/spench image-key web)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "identity=$(tools/spench recipe-key web)" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Reusing $image"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - id: build
        name: Build Web toolchain
        if: steps.metadata.outputs.exists != 'true'
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          targets: web
          # Skip buildx attestations so a single-platform image manifest is
          # published; the pinned recipe key is our reproducible identity.
          provenance: false
          set: |
            web.tags=${{ steps.metadata.outputs.image }}
            web.output=type=registry
            web.cache-from=type=gha,scope=toolchain-web
            web.cache-to=type=gha,mode=max,scope=toolchain-web

  toolchain-android:
    name: Build Android toolchain images
    needs: tools-tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX_X64 || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      ui_image: ${{ steps.metadata.outputs.ui_image }}
      identity: ${{ steps.metadata.outputs.identity }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        name: Resolve Android toolchain image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}/toolchain:android-$(tools/spench image-key android)"
          ui_image="ghcr.io/${GITHUB_REPOSITORY}/toolchain:android-ui-$(tools/spench image-key android-ui)"
          {
            echo "image=$image"
            echo "ui_image=$ui_image"
            echo "identity=$(tools/spench recipe-key android)"
          } >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$image" >/dev/null 2>&1 &&
             docker manifest inspect "$ui_image" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Reusing $image and $ui_image"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - id: build
        name: Build Android toolchain images
        if: steps.metadata.outputs.exists != 'true'
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          targets: android,android-ui
          # Skip buildx attestations so a single-platform image manifest is
          # published; the pinned recipe key is our reproducible identity.
          provenance: false
          set: |
            android.tags=${{ steps.metadata.outputs.image }}
            android.output=type=registry
            android.cache-from=type=gha,scope=toolchain-android
            android.cache-to=type=gha,mode=max,scope=toolchain-android
            android-ui.tags=${{ steps.metadata.outputs.ui_image }}
            android-ui.output=type=registry
            android-ui.cache-from=type=gha,scope=toolchain-android-ui
            android-ui.cache-to=type=gha,mode=max,scope=toolchain-android-ui

  commits:
    name: Check conventional commits
    needs: toolchain-native
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX_X64 || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check pull-request commits
        if: github.event_name == 'pull_request'
        uses: wagoid/commitlint-github-action@v6

  cpp-style:
    name: Lint C and C++
    needs: toolchain-native
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX_X64 || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check changed C and C++ formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          IMAGE: ${{ needs.toolchain-native.outputs.image }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env BASE_SHA \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/workspace \
            --volume "$PWD:/workspace" --workdir /workspace "$IMAGE" \
            bash -lc '
              format_diff="$(git-clang-format --diff "$BASE_SHA" HEAD --extensions c,cc,cpp,h,hpp -- spench platform_wrappers)"
              printf "%s\n" "$format_diff"
              if grep -q "^diff --git " <<< "$format_diff"; then
                exit 1
              fi
            '

  web-lint:
    name: Lint Web SDK and documentation
    needs: toolchain-web
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX_X64 || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: platform_wrappers/web/.nvmrc
          cache: npm
          cache-dependency-path: platform_wrappers/web/package-lock.json
      - run: npm ci
        working-directory: platform_wrappers/web
      - name: Lint Web SDK
        run: npm run lint --workspace=@gigaedge/spench-web-sdk
        working-directory: platform_wrappers/web
      - name: Lint documentation and demo
        run: npm run lint --workspace=@gigaedge/spench-site
        working-directory: platform_wrappers/web

  android-lint:
    name: Lint Android
    needs: toolchain-android
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX_X64 || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: ./.github/actions/verify-lfs
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Detekt
        env:
          IMAGE: ${{ needs.toolchain-android.outputs.image }}
        run: |
          mkdir -p out/cache/container-home out/cache/gradle
          docker run --rm --user "$(id -u):$(id -g)" \
            --env HOME=/workspace/out/cache/container-home \
            --env GRADLE_USER_HOME=/workspace/out/cache/gradle \
            --volume "$PWD:/workspace" --workdir /workspace "$IMAGE" \
            bash -lc 'platform_wrappers/android/gradlew -p platform_wrappers/android detekt'

  ios-lint:
    name: Lint iOS
    needs: toolchain-native
    runs-on: ${{ fromJSON(vars.RUNNER_MACOS_ARM64 || '"macos-15"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install iOS lint tools
        run: brew install swiftlint clang-format
      - run: platform_wrappers/ios/scripts/lint.sh

  workflow-lint:
    name: Check GitHub workflows
    needs: toolchain-native
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX_X64 || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: raven-actions/actionlint@v2
        with:
          # This repository has no inline Python workflow scripts. Avoid making
          # the self-hosted runner install the unused Pyflakes/pipx toolchain.
          pyflakes: false

  deps-native-onnx:
    name: Build Native ONNX Release dependency OCI
    needs: toolchain-native
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX_X64 || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: ./.github/actions/verify-lfs
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-spench-cache
        with:
          preset: native-release-onnx
      - uses: ./.github/actions/build-spench-dependency
        with:
          target: native-release-onnx
          toolchain-identity: ${{ needs.toolchain-native.outputs.identity }}
          toolchain-image: ${{ needs.toolchain-native.outputs.image }}
          token: ${{ secrets.GITHUB_TOKEN }}
          github-source-token: ${{ secrets.GH_PUBLIC_READ_TOKEN }}

  deps-native-tflite:
    name: Build Native TFLite Release dependency OCI
    needs: toolchain-native
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX_X64 || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: ./.github/actions/verify-lfs
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-spench-cache
        with:
          preset: native-release-tflite
      - uses: ./.github/actions/build-spench-dependency
        with:
          target: native-release-tflite
          toolchain-identity: ${{ needs.toolchain-native.outputs.identity }}
          toolchain-image: ${{ needs.toolchain-native.outputs.image }}
          token: ${{ secrets.GITHUB_TOKEN }}
          github-source-token: ${{ secrets.GH_PUBLIC_READ_TOKEN }}

  native-onnx:
    name: Build and test Native Release (ONNX)
    needs: [toolchain-native, deps-native-onnx]
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX_X64 || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: ./.github/actions/verify-lfs
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/build-test-cmake
        with:
          preset: native-release-onnx
          toolchain-identity: ${{ needs.toolchain-native.outputs.identity }}
          toolchain-image: ${{ needs.toolchain-native.outputs.image }}
          token: ${{ secrets.GITHUB_TOKEN }}
          package: 'true'

  native-tflite:
    name: Build and test Native Release (TFLite)
    needs: [toolchain-native, deps-native-tflite]
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX_X64 || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: ./.github/actions/verify-lfs
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/build-test-cmake
        with:
          preset: native-release-tflite
          toolchain-identity: ${{ needs.toolchain-native.outputs.identity }}
          toolchain-image: ${{ needs.toolchain-native.outputs.image }}
          token: ${{ secrets.GITHUB_TOKEN }}
          package: 'true'

  deps-wasm:
    name: Build WASM ONNX Release dependency OCI
    needs: toolchain-web
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX_X64 || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: ./.github/actions/verify-lfs
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-spench-cache
        with:
          preset: wasm-release
      - uses: ./.github/actions/build-spench-dependency
        with:
          target: wasm-release
          toolchain-identity: ${{ needs.toolchain-web.outputs.identity }}
          toolchain-image: ${{ needs.toolchain-web.outputs.image }}
          token: ${{ secrets.GITHUB_TOKEN }}
          github-source-token: ${{ secrets.GH_PUBLIC_READ_TOKEN }}

  web:
    name: Build Web and test unit
    needs: [toolchain-web, deps-wasm]
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX_X64 || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: ./.github/actions/verify-lfs
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-spench-cache
        with:
          preset: wasm-release
      - uses: ./.github/actions/setup-spench-dependency
        with:
          target: wasm-release
          toolchain-identity: ${{ needs.toolchain-web.outputs.identity }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Web
        env:
          SPENCH_TOOLCHAIN_IDENTITY: ${{ needs.toolchain-web.outputs.identity }}
          SPENCH_CONTAINER_IMAGE_WEB: ${{ needs.toolchain-web.outputs.image }}
          SPENCH_SITE_BASE: ${{ github.event_name == 'pull_request' && format('/spench/pr/{0}/', github.event.number) || '/spench/' }}
        run: tools/spench build web
      - name: Test Web SDK unit
        env:
          SPENCH_TOOLCHAIN_IDENTITY: ${{ needs.toolchain-web.outputs.identity }}
          SPENCH_CONTAINER_IMAGE_WEB: ${{ needs.toolchain-web.outputs.image }}
        run: tools/spench test web
      - name: Package Web SDK
        env:
          SPENCH_TOOLCHAIN_IDENTITY: ${{ needs.toolchain-web.outputs.identity }}
          SPENCH_CONTAINER_IMAGE_WEB: ${{ needs.toolchain-web.outputs.image }}
        run: tools/spench package web
      - name: Upload Web SDK package
        uses: actions/upload-artifact@v7
        with:
          name: spench-web-sdk-${{ github.sha }}
          path: out/artifacts/web/*.tgz
          if-no-files-found: error
          retention-days: 1
      - name: Upload Web site
        uses: actions/upload-artifact@v7
        with:
          name: spench-web-site-${{ github.sha }}
          path: platform_wrappers/web/apps/spench-site/build
          if-no-files-found: error
          retention-days: 1

  web-playwright:
    name: Test Web Playwright
    needs: [toolchain-web, web]
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX_X64 || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: ./.github/actions/verify-lfs
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: spench-web-sdk-${{ github.sha }}
          path: out/artifacts/web
      - uses: actions/setup-node@v6
        with:
          node-version-file: platform_wrappers/web/.nvmrc
          cache: npm
          cache-dependency-path: platform_wrappers/web/package-lock.json
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: out/cache/playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('platform_wrappers/web/package-lock.json') }}
      - name: Install Web test dependencies
        working-directory: platform_wrappers/web
        run: npm ci
      - name: Install built Web SDK package
        working-directory: platform_wrappers/web
        run: |
          package="$(find "$GITHUB_WORKSPACE/out/artifacts/web" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$package"
          npm install --no-save --package-lock=false --workspaces=false --prefix apps/spench-site "$package"
          test -f apps/spench-site/node_modules/@gigaedge/spench-web-sdk/dist/index.d.ts
      - name: Test Web Playwright
        env:
          SPENCH_TOOLCHAIN_IDENTITY: ${{ needs.toolchain-web.outputs.identity }}
          SPENCH_CONTAINER_IMAGE_WEB: ${{ needs.toolchain-web.outputs.image }}
        run: tools/spench test web-playwright
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ github.sha }}
          path: |
            platform_wrappers/web/apps/spench-site/playwright-report
            platform_wrappers/web/apps/spench-site/test-results
          if-no-files-found: ignore
          retention-days: 1

  preview:
    name: Publish PR web preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: web
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX_X64 || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: pages-preview-${{ github.event.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: spench-web-site-${{ github.sha }}
          path: web-preview
      - name: Publish PR preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: web-preview
          destination_dir: pr/${{ github.event.number }}
          keep_files: true

  deps-android:
    name: Build Android ${{ matrix.abi }} Release dependency OCI
    needs: toolchain-android
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX_X64 || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: ./.github/actions/verify-lfs
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-spench-cache
        with:
          preset: android-release-tflite-${{ matrix.abi }}
      - uses: ./.github/actions/build-spench-dependency
        with:
          target: android-release-tflite-${{ matrix.abi }}
          toolchain-identity: ${{ needs.toolchain-android.outputs.identity }}
          toolchain-image: ${{ needs.toolchain-android.outputs.image }}
          token: ${{ secrets.GITHUB_TOKEN }}
          github-source-token: ${{ secrets.GH_PUBLIC_READ_TOKEN }}
      - name: Report Android dependency failure resources
        if: failure()
        run: |
          free -h
          df -h .

  android:
    name: Build and test Android Release
    needs: [toolchain-android, deps-android]
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX_X64 || '"ubuntu-24.04"') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: ./.github/actions/verify-lfs
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-spench-cache
        with:
          preset: android
      - uses: ./.github/actions/setup-spench-dependency
        with:
          target: android-release-tflite-arm64-v8a
          toolchain-identity: ${{ needs.toolchain-android.outputs.identity }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-spench-dependency
        with:
          target: android-release-tflite-armeabi-v7a
          toolchain-identity: ${{ needs.toolchain-android.outputs.identity }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-spench-dependency
        with:
          target: android-release-tflite-x86_64
          toolchain-identity: ${{ needs.toolchain-android.outputs.identity }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-spench-dependency
        with:
          target: android-release-tflite-x86
          toolchain-identity: ${{ needs.toolchain-android.outputs.identity }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Android Release
        env:
          SPENCH_TOOLCHAIN_IDENTITY: ${{ needs.toolchain-android.outputs.identity }}
          SPENCH_CONTAINER_IMAGE_ANDROID: ${{ needs.toolchain-android.outputs.image }}
        run: tools/spench build android
      - name: Test Android Release
        env:
          SPENCH_CONTAINER_IMAGE_ANDROID: ${{ needs.toolchain-android.outputs.image }}
        run: tools/spench test android
      - name: Enable KVM access
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Test Android Release UI
        env:
          SPENCH_CONTAINER_IMAGE_ANDROID_UI: ${{ needs.toolchain-android.outputs.ui_image }}
        run: tools/spench test android-ui
      - name: Upload Android UI test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-ui-diagnostics-${{ github.sha }}
          path: |
            out/artifacts/android-emulator.log
