name: Build Python wheel toolchain
description: Resolve and build the content-addressed manylinux toolchain image.
inputs:
  token:
    description: GitHub token with packages write permission.
    required: true
outputs:
  image:
    description: Immutable recipe-tagged toolchain image.
    value: ${{ steps.metadata.outputs.image }}
  identity:
    description: Pinned manylinux/compiler/tool identity.
    value: ${{ steps.metadata.outputs.identity }}
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - id: metadata
      shell: bash
      run: |
        image="ghcr.io/${GITHUB_REPOSITORY}/toolchain:python-$(tools/ci image-key python)"
        echo "image=$image" >> "$GITHUB_OUTPUT"
        echo "identity=$(tools/ci recipe-key python)" >> "$GITHUB_OUTPUT"
        if docker manifest inspect "$image" >/dev/null 2>&1; then
          echo 'exists=true' >> "$GITHUB_OUTPUT"
        else
          echo 'exists=false' >> "$GITHUB_OUTPUT"
        fi
    - if: steps.metadata.outputs.exists != 'true'
      uses: docker/bake-action@v7
      with:
        source: .
        files: docker-bake.hcl
        targets: python
        provenance: false
        set: |
          python.tags=${{ steps.metadata.outputs.image }}
          python.output=type=registry
          python.cache-from=type=gha,scope=toolchain-python
          python.cache-to=type=gha,mode=max,scope=toolchain-python
