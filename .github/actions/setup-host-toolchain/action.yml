name: Set up host toolchain
description: Pin CMake and derive an immutable identity for macOS, iOS, and Windows bundles.

inputs:
  install-xcodegen:
    description: Install XcodeGen when building the iOS SDK project.
    required: false
    default: 'false'

outputs:
  identity:
    description: Host OS, architecture, compiler, SDK, and CMake identity.
    value: ${{ steps.macos.outputs.value || steps.windows.outputs.value }}

runs:
  using: composite
  steps:
    - uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: 3.31.x

    - if: runner.os == 'macOS'
      shell: bash
      run: brew install ccache

    - name: Install XcodeGen
      if: runner.os == 'macOS' && inputs.install-xcodegen == 'true'
      shell: bash
      run: brew install xcodegen

    # onnxruntime and TensorFlow vendor very deeply nested source trees. Combined
    # with the CI build root they exceed the legacy 260-character MAX_PATH limit,
    # which breaks both the FetchContent git clone ("Filename too long") and the
    # MSBuild custom-build steps that generate onnxruntime kernel sources. Enable
    # long paths for Git and the OS so long-path-aware tooling (Git, CMake, Ninja,
    # MSBuild) can create these files.
    - if: runner.os == 'Windows'
      name: Enable Windows long paths
      shell: pwsh
      run: |
        git config --system core.longpaths true
        New-ItemProperty `
          -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
          -Name 'LongPathsEnabled' -Value 1 -PropertyType DWORD -Force | Out-Null

    - id: macos
      if: runner.os == 'macOS'
      shell: bash
      run: |
        material="$(cmake --version; xcodebuild -version; clang --version; uname -m)"
        digest="$(printf '%s' "$material" | shasum -a 256 | cut -c1-16)"
        echo "value=macos-$(uname -m)-$digest" >> "$GITHUB_OUTPUT"

    - id: windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $visualStudio = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        $toolset = (Get-ChildItem "$visualStudio\VC\Tools\MSVC" -Directory | Sort-Object Name | Select-Object -Last 1).Name
        $material = "$(cmake --version)`n$toolset`n$env:ImageOS"
        $bytes = [Text.Encoding]::UTF8.GetBytes($material)
        $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
        "value=windows-x86_64-$($hash.Substring(0, 16))" >> $env:GITHUB_OUTPUT
