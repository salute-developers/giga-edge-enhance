name: Set up host toolchain
description: Pin CMake and derive an immutable identity for macOS, iOS, and Windows bundles.

outputs:
  identity:
    description: Host OS, architecture, compiler, SDK, and CMake identity.
    value: ${{ steps.macos.outputs.value || steps.windows.outputs.value }}

runs:
  using: composite
  steps:
    - uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: 3.31.x

    - id: macos
      if: runner.os == 'macOS'
      shell: bash
      run: |
        material="$(cmake --version; xcodebuild -version; clang --version; uname -m)"
        digest="$(printf '%s' "$material" | shasum -a 256 | cut -c1-16)"
        echo "value=macos-$(uname -m)-$digest" >> "$GITHUB_OUTPUT"

    - id: windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $visualStudio = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        $toolset = (Get-ChildItem "$visualStudio\VC\Tools\MSVC" -Directory | Sort-Object Name | Select-Object -Last 1).Name
        $material = "$(cmake --version)`n$toolset`n$env:ImageOS"
        $bytes = [Text.Encoding]::UTF8.GetBytes($material)
        $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
        "value=windows-x86_64-$($hash.Substring(0, 16))" >> $env:GITHUB_OUTPUT
