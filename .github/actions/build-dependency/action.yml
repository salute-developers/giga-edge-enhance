name: Build GigaEdgeEnhance dependency bundle
description: Build and publish one concrete engine bundle to GHCR with ORAS.

inputs:
  target:
    description: Concrete tools dependency target.
    required: true
  toolchain-identity:
    description: Immutable digest of the toolchain used to build the bundle.
    required: true
  toolchain-image:
    description: Runnable toolchain image used by containerized targets.
    required: false
    default: ''
  token:
    description: GitHub token with packages:write.
    required: true

outputs:
  reference:
    description: Immutable GHCR reference for the dependency bundle.
    value: ${{ steps.metadata.outputs.reference }}

runs:
  using: composite
  steps:
    - uses: oras-project/setup-oras@v2

    # Keep registry credentials in this job's temp directory rather than the
    # account-wide Docker config. A self-hosted macOS runner inherits
    # credsStore=osxkeychain from Docker Desktop, and storing a credential in
    # the login keychain from a session that cannot prompt fails with "User
    # interaction is not allowed". Scoped per step so plain docker commands
    # keep using the config that docker/login-action wrote.
    - name: Log in to GHCR
      shell: bash
      env:
        GHCR_TOKEN: ${{ inputs.token }}
        DOCKER_CONFIG: ${{ runner.temp }}/gdn-oras
      run: |
        mkdir -p "${DOCKER_CONFIG//\\//}"
        echo "$GHCR_TOKEN" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin

    - name: Resolve dependency identity
      id: metadata
      shell: bash
      env:
        GEE_TOOLCHAIN_IDENTITY: ${{ inputs.toolchain-identity }}
        GEE_CONTAINER_IMAGE_NATIVE: ${{ inputs.toolchain-image }}
        GEE_CONTAINER_IMAGE_PYTHON: ${{ inputs.toolchain-image }}
        GEE_CONTAINER_IMAGE_WEB: ${{ inputs.toolchain-image }}
        GEE_CONTAINER_IMAGE_ANDROID: ${{ inputs.toolchain-image }}
        TARGET: ${{ inputs.target }}
        DOCKER_CONFIG: ${{ runner.temp }}/gdn-oras
      run: |
        python_command=python3
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          python_command=python
        fi
        tag="$($python_command tools/ci dependency-key "$TARGET")"
        reference="ghcr.io/${GITHUB_REPOSITORY}/dependencies:${tag}"
        echo "reference=$reference" >> "$GITHUB_OUTPUT"
        if oras manifest fetch "$reference" >/dev/null 2>&1; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "Reusing $reference"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Build dependency bundle
      if: steps.metadata.outputs.exists != 'true'
      shell: bash
      env:
        GEE_TOOLCHAIN_IDENTITY: ${{ inputs.toolchain-identity }}
        GEE_CONTAINER_IMAGE_NATIVE: ${{ inputs.toolchain-image }}
        GEE_CONTAINER_IMAGE_PYTHON: ${{ inputs.toolchain-image }}
        GEE_CONTAINER_IMAGE_WEB: ${{ inputs.toolchain-image }}
        GEE_CONTAINER_IMAGE_ANDROID: ${{ inputs.toolchain-image }}
        TARGET: ${{ inputs.target }}
      run: |
        python_command=python3
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          python_command=python
        fi
        $python_command tools/ci prepare-deps "$TARGET"

    - name: Publish dependency OCI artifact
      if: steps.metadata.outputs.exists != 'true'
      shell: bash
      env:
        GEE_TOOLCHAIN_IDENTITY: ${{ inputs.toolchain-identity }}
        TARGET: ${{ inputs.target }}
        REFERENCE: ${{ steps.metadata.outputs.reference }}
        DOCKER_CONFIG: ${{ runner.temp }}/gdn-oras
      run: |
        python_command=python3
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          python_command=python
        fi
        archive="$($python_command tools/ci dependency-archive "$TARGET")"
        archive_dir="$(dirname "$archive")"
        archive_name="$(basename "$archive")"
        (
          cd "$archive_dir"
          oras push \
            --artifact-type application/vnd.gigaedge.denoiser.dependency.v1 \
            "$REFERENCE" \
            "$archive_name:application/gzip" \
            "$archive_name.sha256:text/plain"
        )
