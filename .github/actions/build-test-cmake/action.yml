name: Build and test Spench CMake target
description: Restore one dependency bundle, then build and test one existing CMake preset.

inputs:
  preset:
    required: true
    description: CMake preset accepted by tools/spench.
  toolchain-identity:
    required: true
    description: Immutable toolchain identity used by the dependency bundle.
  toolchain-image:
    required: false
    default: ''
    description: Runnable container image for Docker-based presets.
  token:
    required: true
    description: GitHub token with packages:read.
  package:
    required: false
    default: 'false'
    description: Package the existing build after tests pass.

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-spench-cache
      with:
        preset: ${{ inputs.preset }}

    - uses: ./.github/actions/setup-spench-dependency
      with:
        target: ${{ inputs.preset }}
        toolchain-identity: ${{ inputs.toolchain-identity }}
        token: ${{ inputs.token }}

    - name: Build ${{ inputs.preset }}
      shell: bash
      env:
        PRESET: ${{ inputs.preset }}
        SPENCH_TOOLCHAIN_IDENTITY: ${{ inputs.toolchain-identity }}
        SPENCH_CONTAINER_IMAGE_NATIVE: ${{ inputs.toolchain-image }}
        SPENCH_CONTAINER_IMAGE_WEB: ${{ inputs.toolchain-image }}
      run: |
        python_command=python3
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          python_command=python
        fi
        $python_command tools/spench build "$PRESET"

    - name: Test ${{ inputs.preset }}
      shell: bash
      env:
        PRESET: ${{ inputs.preset }}
        SPENCH_TOOLCHAIN_IDENTITY: ${{ inputs.toolchain-identity }}
        SPENCH_CONTAINER_IMAGE_NATIVE: ${{ inputs.toolchain-image }}
        SPENCH_CONTAINER_IMAGE_WEB: ${{ inputs.toolchain-image }}
      run: |
        python_command=python3
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          python_command=python
        fi
        $python_command tools/spench test "$PRESET"

    - name: Install ${{ inputs.preset }}
      shell: bash
      env:
        PRESET: ${{ inputs.preset }}
        SPENCH_TOOLCHAIN_IDENTITY: ${{ inputs.toolchain-identity }}
        SPENCH_CONTAINER_IMAGE_NATIVE: ${{ inputs.toolchain-image }}
        SPENCH_CONTAINER_IMAGE_WEB: ${{ inputs.toolchain-image }}
      run: |
        python_command=python3
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          python_command=python
        fi
        $python_command tools/spench install "$PRESET"

    - name: Upload installed ${{ inputs.preset }} SDK
      uses: actions/upload-artifact@v7
      with:
        name: spench-install-${{ inputs.preset }}-${{ github.sha }}
        path: out/artifacts/install/${{ inputs.preset }}
        if-no-files-found: error
        retention-days: 14

    - name: Package ${{ inputs.preset }}
      if: inputs.package == 'true'
      shell: bash
      env:
        PRESET: ${{ inputs.preset }}
        SPENCH_CONTAINER_IMAGE_NATIVE: ${{ inputs.toolchain-image }}
      run: |
        python_command=python3
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          python_command=python
        fi
        $python_command tools/spench package "$PRESET"

    - name: Upload packaged ${{ inputs.preset }} SDK
      if: inputs.package == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: spench-package-${{ inputs.preset }}-${{ github.sha }}
        path: out/artifacts/${{ inputs.preset }}
        if-no-files-found: error
        retention-days: 14
