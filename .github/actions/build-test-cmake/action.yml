name: Build and test GigaDenoiser CMake target
description: Restore one dependency bundle, then build and test one existing CMake preset.

inputs:
  preset:
    required: true
    description: CMake preset accepted by tools.
  toolchain-identity:
    required: true
    description: Immutable toolchain identity used by the dependency bundle.
  toolchain-image:
    required: false
    default: ''
    description: Runnable container image for Docker-based presets.
  token:
    required: true
    description: GitHub token with packages:read.
  package:
    required: false
    default: 'false'
    description: Package the existing build after tests pass.

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-cache
      with:
        preset: ${{ inputs.preset }}

    - uses: ./.github/actions/setup-dependency
      with:
        target: ${{ inputs.preset }}
        toolchain-identity: ${{ inputs.toolchain-identity }}
        token: ${{ inputs.token }}

    - name: Build ${{ inputs.preset }}
      shell: bash
      env:
        PRESET: ${{ inputs.preset }}
        GDN_TOOLCHAIN_IDENTITY: ${{ inputs.toolchain-identity }}
        GDN_CONTAINER_IMAGE_NATIVE: ${{ inputs.toolchain-image }}
        GDN_CONTAINER_IMAGE_WEB: ${{ inputs.toolchain-image }}
      run: |
        python_command=python3
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          python_command=python
        fi
        $python_command tools/build "$PRESET"

    - name: Test ${{ inputs.preset }}
      shell: bash
      env:
        PRESET: ${{ inputs.preset }}
        GDN_TOOLCHAIN_IDENTITY: ${{ inputs.toolchain-identity }}
        GDN_CONTAINER_IMAGE_NATIVE: ${{ inputs.toolchain-image }}
        GDN_CONTAINER_IMAGE_WEB: ${{ inputs.toolchain-image }}
      run: |
        python_command=python3
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          python_command=python
        fi
        $python_command tools/test "$PRESET"

    - name: Install ${{ inputs.preset }}
      shell: bash
      env:
        PRESET: ${{ inputs.preset }}
        GDN_TOOLCHAIN_IDENTITY: ${{ inputs.toolchain-identity }}
        GDN_CONTAINER_IMAGE_NATIVE: ${{ inputs.toolchain-image }}
        GDN_CONTAINER_IMAGE_WEB: ${{ inputs.toolchain-image }}
      run: |
        python_command=python3
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          python_command=python
        fi
        $python_command tools/install "$PRESET"

    - name: Upload installed ${{ inputs.preset }} SDK
      if: vars.ENABLE_ARTIFACT_UPLOADS != 'false'
      uses: actions/upload-artifact@v7
      with:
        name: gdn-install-${{ inputs.preset }}-${{ github.sha }}
        path: out/artifacts/install/${{ inputs.preset }}
        if-no-files-found: error
        retention-days: ${{ github.event_name == 'pull_request' && (vars.PR_ARTIFACT_RETENTION_DAYS || '1') || (vars.MASTER_ARTIFACT_RETENTION_DAYS || '3') }}

    - name: Package ${{ inputs.preset }}
      if: inputs.package == 'true'
      shell: bash
      env:
        PRESET: ${{ inputs.preset }}
        GDN_CONTAINER_IMAGE_NATIVE: ${{ inputs.toolchain-image }}
      run: |
        python_command=python3
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          python_command=python
        fi
        $python_command tools/package "$PRESET"

    - name: Upload packaged ${{ inputs.preset }} SDK
      if: inputs.package == 'true' && vars.ENABLE_ARTIFACT_UPLOADS != 'false'
      uses: actions/upload-artifact@v7
      with:
        name: gdn-package-${{ inputs.preset }}-${{ github.sha }}
        path: out/artifacts/${{ inputs.preset }}
        if-no-files-found: error
        retention-days: ${{ github.event_name == 'pull_request' && (vars.PR_ARTIFACT_RETENTION_DAYS || '1') || (vars.MASTER_ARTIFACT_RETENTION_DAYS || '3') }}

    - name: Upload CMake and CTest diagnostics
      if: failure() && vars.ENABLE_ARTIFACT_UPLOADS != 'false'
      uses: actions/upload-artifact@v7
      with:
        name: cmake-diagnostics-${{ inputs.preset }}-${{ github.sha }}
        path: |
          out/build/**/CMakeFiles/CMakeConfigureLog.yaml
          out/build/**/CMakeFiles/CMakeOutput.log
          out/build/**/CMakeFiles/CMakeError.log
          out/build/**/Testing/Temporary/**
        if-no-files-found: ignore
        retention-days: 1
