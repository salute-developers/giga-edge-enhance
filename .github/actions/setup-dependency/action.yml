name: Restore GigaEdgeSpench dependency bundle
description: Restore one concrete engine bundle from GHCR with ORAS.

inputs:
  target:
    description: Concrete tools dependency target.
    required: true
  toolchain-identity:
    description: Immutable digest of the toolchain that produced the bundle.
    required: true
  token:
    description: GitHub token with packages:read.
    required: true

runs:
  using: composite
  steps:
    - uses: oras-project/setup-oras@v2

    # Keep registry credentials in this job's temp directory rather than the
    # account-wide Docker config. A self-hosted macOS runner inherits
    # credsStore=osxkeychain from Docker Desktop, and storing a credential in
    # the login keychain from a session that cannot prompt fails with "User
    # interaction is not allowed". Scoped per step so plain docker commands
    # keep using the config that docker/login-action wrote.
    - name: Log in to GHCR
      shell: bash
      env:
        GHCR_TOKEN: ${{ inputs.token }}
        DOCKER_CONFIG: ${{ runner.temp }}/gdn-oras
      run: |
        mkdir -p "${DOCKER_CONFIG//\\//}"
        echo "$GHCR_TOKEN" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin

    - name: Restore dependency OCI artifact
      shell: bash
      env:
        GES_TOOLCHAIN_IDENTITY: ${{ inputs.toolchain-identity }}
        TARGET: ${{ inputs.target }}
        DOCKER_CONFIG: ${{ runner.temp }}/gdn-oras
      run: |
        python_command=python3
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          python_command=python
        fi
        tag="$($python_command tools/ci dependency-key "$TARGET")"
        reference="ghcr.io/${GITHUB_REPOSITORY}/dependencies:${tag}"
        download_dir="${RUNNER_TEMP}/gdn-dependency-${tag}"
        mkdir -p "$download_dir"
        oras pull "$reference" --output "$download_dir"
        archive="$(find "$download_dir" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
        if [[ -z "$archive" ]]; then
          echo "error: $reference did not contain a dependency archive" >&2
          exit 1
        fi
        $python_command tools/ci restore-deps "$TARGET" "$archive"
