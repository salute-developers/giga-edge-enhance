[build-system]
requires = ["scikit-build-core==0.11.6", "pybind11==3.0.1"]
build-backend = "scikit_build_core.build"

[project]
name = "giga-edge-enhance"
dynamic = ["version"]
description = "GigaEdge Enhance audio processing SDK"
readme = "python/readme.md"
requires-python = ">=3.10,<3.15"
license = {file = "LICENSE.txt"}
dependencies = ["numpy>=1.26,<3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]

[project.optional-dependencies]
hub = ["huggingface-hub>=0.34,<2"]
io = ["soundfile>=0.14,<1"]
all = ["huggingface-hub>=0.34,<2", "soundfile>=0.14,<1"]

[project.urls]
Repository = "https://github.com/salute-developers/giga-edge-enhance"

[tool.scikit-build]
cmake.source-dir = "python"
cmake.version = ">=3.25"
cmake.build-type = "Release"
build-dir = "out/python/build/{wheel_tag}"
wheel.packages = ["python/src/giga_edge_enhance"]
install.components = ["python"]
sdist.exclude = ["out/**", "models/**", "samples/**", "core/tests/data/**", "web/**", "android/**", "ios/**", ".git/**", "**/__pycache__/**"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION_NUMBER"
regex = '^(?P<value>\d+\.\d+\.\d+)'

[tool.pytest.ini_options]
testpaths = ["python/tests"]
markers = ["native: requires the built ONNX and TFLite extensions"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Private Windows DLL directories must be installed before facade imports.
"python/src/giga_edge_enhance/__init__.py" = ["E402"]
"python/scripts/wheels.py" = ["E402"]

[tool.cibuildwheel]
build = "cp3{10,11,12,13,14}-*"
skip = "*-musllinux_* *-win32 *-manylinux_i686"
before-build = "python {project}/python/scripts/wheels.py configure"
build-verbosity = 1

[tool.cibuildwheel.linux]
archs = ["x86_64"]
repair-wheel-command = "auditwheel repair --plat manylinux_2_28_x86_64 -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
archs = ["native"]
environment = { MACOSX_DEPLOYMENT_TARGET = "13.0" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
repair-wheel-command = "delvewheel repair --analyze-existing -w {dest_dir} {wheel}"
