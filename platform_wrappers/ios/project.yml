name: SpenchSDK
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
targets:
  SpenchAudioKit:
    type: framework
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gigaedge.SpenchAudioKit
        DEFINES_MODULE: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        GENERATE_INFOPLIST_FILE: YES
        MODULEMAP_PRIVATE_FILE: "$(SRCROOT)/Sources/SpenchAudioKit/include/SpenchAudioKit.private.modulemap"
        OTHER_LDFLAGS: "$(inherited) -lspench"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../../spench/include"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: "$(SRCROOT)/build/core/device"
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: "$(SRCROOT)/build/core/simulator"
    sources:
      - path: Sources/SpenchAudioKit/Swift
      - path: Sources/SpenchAudioKit/ObjC
      - path: Sources/SpenchAudioKit/Documentation.docc
      - path: Sources/SpenchAudioKit/include/SpenchAudioKit.h
        buildPhase: headers
        headerVisibility: public
      - path: Sources/SpenchAudioKit/include/PipelineElements.h
        buildPhase: headers
        headerVisibility: private
      - path: Sources/SpenchAudioKit/include/RingBuffer.h
        buildPhase: headers
        headerVisibility: private
      - path: Sources/SpenchAudioKit/include/AtomicOptionalDouble.h
        buildPhase: headers
        headerVisibility: private
      - path: Sources/SpenchAudioKit/include/WorkerThreadEvent.h
        buildPhase: headers
        headerVisibility: private

  SpenchModelLite8k:
    type: bundle
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gigaedge.SpenchModelLite8k
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/ModelBundles/SpenchModelLite8k-Info.plist
    sources:
      - path: Resources/Models/fast_model_int8_8k.spench

  SpenchModelLite24k:
    type: bundle
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gigaedge.SpenchModelLite24k
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/ModelBundles/SpenchModelLite24k-Info.plist
    sources:
      - path: Resources/Models/fast_model_int8.spench

  SpenchModelFull24k:
    type: bundle
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gigaedge.SpenchModelFull24k
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/ModelBundles/SpenchModelFull24k-Info.plist
    sources:
      - path: Resources/Models/mobile_group8_hybrid_loss_fp32.spench

  AudioDemoApp:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gigaedge.AudioDemoApp
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/AudioDemoApp/Info.plist
    dependencies:
      - target: SpenchAudioKit
      - target: SpenchModelLite8k
      - target: SpenchModelLite24k
      - target: SpenchModelFull24k
    sources:
      - path: Sources/AudioDemoApp
    postBuildScripts:
      - name: Copy model bundles
        script: |
          set -euo pipefail
          "$SRCROOT/scripts/copy_model_bundles.sh" \
            "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" \
            SpenchModelLite8k \
            SpenchModelLite24k \
            SpenchModelFull24k

  SpenchAudioKitTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gigaedge.SpenchAudioKitTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SpenchAudioKit
      - target: SpenchModelLite8k
      - target: SpenchModelLite24k
      - target: SpenchModelFull24k
    sources:
      - path: Tests/SpenchAudioKitTests
    postBuildScripts:
      - name: Copy model bundles
        script: |
          set -euo pipefail
          "$SRCROOT/scripts/copy_model_bundles.sh" \
            "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" \
            SpenchModelLite8k \
            SpenchModelLite24k \
            SpenchModelFull24k

  AudioDemoAppUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gigaedge.AudioDemoAppUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AudioDemoApp
    dependencies:
      - target: AudioDemoApp
    sources:
      - path: Tests/AudioDemoAppUITests
    scheme:
      testTargets:
        - AudioDemoAppUITests

schemes:
  SpenchAudioKit:
    build:
      targets:
        SpenchAudioKit: all
        SpenchModelLite8k: all
        SpenchModelLite24k: all
        SpenchModelFull24k: all
        SpenchAudioKitTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - SpenchAudioKitTests

  AudioDemoApp:
    build:
      targets:
        AudioDemoApp: all
    run:
      config: Debug
    test:
      gatherCoverageData: true
      targets:
        - AudioDemoAppUITests
