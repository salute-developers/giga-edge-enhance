name: SpenchSDK
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
targets:
  SpenchAudioKit:
    type: framework
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gigaedge.SpenchAudioKit
        DEFINES_MODULE: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        GENERATE_INFOPLIST_FILE: YES
        MODULEMAP_PRIVATE_FILE: "$(SRCROOT)/Sources/SpenchAudioKit/include/SpenchAudioKit.private.modulemap"
        OTHER_LDFLAGS: "$(inherited) -lspench"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../../spench/include"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: "$(SRCROOT)/../../out/artifacts/ios/device"
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: "$(SRCROOT)/../../out/artifacts/ios/simulator"
    preBuildScripts:
      - name: Build Spench core
        script: |
          set -euo pipefail
          "$SRCROOT/scripts/build_core.sh"
    sources:
      - path: Sources/SpenchAudioKit/Swift
      - path: Sources/SpenchAudioKit/ObjC
      - path: Sources/SpenchAudioKit/Documentation.docc
      - path: Sources/SpenchAudioKit/include/SpenchAudioKit.h
        buildPhase: headers
        headerVisibility: public
      - path: Sources/SpenchAudioKit/include/PipelineElements.h
        buildPhase: headers
        headerVisibility: private
      - path: Sources/SpenchAudioKit/include/RingBuffer.h
        buildPhase: headers
        headerVisibility: private
      - path: Sources/SpenchAudioKit/include/AtomicOptionalDouble.h
        buildPhase: headers
        headerVisibility: private
      - path: Sources/SpenchAudioKit/include/WorkerThreadEvent.h
        buildPhase: headers
        headerVisibility: private

  SpenchModelLite8k:
    type: bundle
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gigaedge.SpenchModelLite8k
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/ModelBundles/SpenchModelLite8k-Info.plist
    sources:
      - path: Resources/Models/fast8.spench

  SpenchModelQuality48k:
    type: bundle
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gigaedge.SpenchModelQuality48k
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/ModelBundles/SpenchModelQuality48k-Info.plist
    sources:
      - path: Resources/Models/quality48.spench

  AudioDemoApp:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gigaedge.AudioDemoApp
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/AudioDemoApp/Info.plist
    dependencies:
      - target: SpenchAudioKit
      - target: SpenchModelLite8k
      - target: SpenchModelQuality48k
    sources:
      - path: Sources/AudioDemoApp

  SpenchAudioKitTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gigaedge.SpenchAudioKitTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SpenchAudioKit
      - target: SpenchModelLite8k
      - target: SpenchModelQuality48k
    sources:
      - path: Tests/SpenchAudioKitTests

  AudioDemoAppUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gigaedge.AudioDemoAppUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AudioDemoApp
    dependencies:
      - target: AudioDemoApp
    sources:
      - path: Tests/AudioDemoAppUITests
    scheme:
      testTargets:
        - AudioDemoAppUITests

schemes:
  SpenchAudioKit:
    build:
      targets:
        SpenchAudioKit: all
        SpenchModelLite8k: all
        SpenchModelQuality48k: all
        SpenchAudioKitTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - SpenchAudioKitTests

  AudioDemoApp:
    build:
      targets:
        AudioDemoApp: all
    run:
      config: Debug
    test:
      gatherCoverageData: true
      targets:
        - AudioDemoAppUITests
