server {
    server_name {{ service_key }}.{{ service_environment }}.{{ DEPLOY_TARGET_DOMAIN }};
    listen 80;
    listen [::]:80;

    return 301 https://$host$request_uri;
}

server {
    server_name {{ service_key }}.{{ service_environment }}.{{ DEPLOY_TARGET_DOMAIN }};

    {% include "files/conf/includes/ssl.conf" %}
    {% include "files/conf/includes/gzip.conf" %}
    {% include "files/conf/includes/disable-source-maps.conf" %}

    # Uncomment me to debug rewrites
    #error_log /var/log/nginx/{{ service_key }}.rewrite_error.log notice;
    #rewrite_log on;

    access_log  /var/log/nginx/{{ service_key }}.access.log  main;

    location = / {
        sd_ci pr-auth-proxy disabled;
        {% include "files/conf/includes/sd-redirect.conf" %}

        {% include "files/conf/includes/common.conf" %}

        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Embedder-Policy "require-corp";
        add_header Cross-Origin-Opener-Policy "same-origin";

        rewrite ^ /index.html;
        rewrite ^\/(.*)$ /{{ service_key }}/{{ service_version }}/$1  break;

        error_page 404 /404.html;

        {% include "files/conf/includes/proxy_pass_s3.conf" %}
    }

    # rewrite any/ to any/index.html
    location ~ /(.+)/$ {
        add_header Cache-Control "no-cache";

        {% include "files/conf/includes/common.conf" %}

        rewrite ^(.*)/$ $1/index.html;
        rewrite ^\/(.*)$ /{{ service_key }}/{{ service_version }}/$1  break;
        error_page 404 /404.html;

        {% include "files/conf/includes/proxy_pass_s3.conf" %}
    }

    location / {
        sd_ci pr-auth-proxy disabled;
        add_header Cross-Origin-Embedder-Policy "require-corp";

        rewrite ^\/(.*)$ /{{ service_key }}/{{ service_version }}/$1  break;
        error_page 404 /404.html;

        {% include "files/conf/includes/common.conf" %}

        {% include "files/conf/includes/proxy_pass_s3.conf" %}
    }

    location = /404.html {
            root /data/nginx/pages;
            internal;
    }

    {% include "files/conf/includes/robots-disallow.conf" %}
}
