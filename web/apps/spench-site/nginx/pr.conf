server {
    server_name pr-{{ pr.number }}{{ pr.suffix }}-{{ service_key }}.dev.{{ DEPLOY_TARGET_DOMAIN }};
    listen 80;
    listen [::]:80;

    return 301 https://$host$request_uri;
}

server {
    server_name pr-{{ pr.number }}{{ pr.suffix }}-{{ service_key }}.dev.{{ DEPLOY_TARGET_DOMAIN }};

    {% include "files/conf/includes/ssl.conf" %}

    {% include "files/conf/includes/gzip.conf" %}
    {% include "files/conf/includes/disable-source-maps.conf" %}

    access_log  /var/log/nginx/pr.access.log  main;

    location = / {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Embedder-Policy "require-corp";
        add_header Cross-Origin-Opener-Policy "same-origin";

        {% include "files/conf/includes/common.conf" %}

        rewrite ^ /index.html;
        rewrite ^\/(.*)$ /{{ service_key }}/{{ service_version }}/$1  break;

        error_page 404 /404.html;

        {% include "files/conf/includes/cors.conf" %}
        {% include "files/conf/includes/proxy_pass_s3.conf" %}
    }

    # rewrite any/ to any/index.html
    location ~ /(.+)/$ {
        add_header Cache-Control "no-cache";

        {% include "files/conf/includes/common.conf" %}

        rewrite ^(.*)/$ $1/index.html;
        rewrite ^\/(.*)$ /{{ service_key }}/{{ service_version }}/$1  break;
        error_page 404 /404.html;

        {% include "files/conf/includes/proxy_pass_s3.conf" %}
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Embedder-Policy "require-corp";

        {% include "files/conf/includes/common.conf" %}

        rewrite ^\/(.*)$ /{{ service_key }}/{{ service_version }}/$1  break;
        error_page 404 /404.html;

        {% include "files/conf/includes/cors.conf" %}
        {% include "files/conf/includes/proxy_pass_s3.conf" %}
    }

    location = /404.html {
        root /data/nginx/pages;
        internal;
    }

    {% include "files/conf/includes/robots-disallow.conf" %}
}
